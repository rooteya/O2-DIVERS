<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>O2 Divers – بوابة الأعضاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b2430;--mu:#68758a;--ac:#0f766e;--ac2:#e6f4f2;--bd:#e1e5eb;--bad:#b42318;--ok:#067647;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#19212b;--tx:#e8edf3;--mu:#97a4b6;--ac:#2dd4bf;--ac2:#13302f;--bd:#2a3542;--bad:#f97066;--ok:#47cd89;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151c;--card:#19212b;--tx:#e8edf3;--mu:#97a4b6;--ac:#2dd4bf;--ac2:#13302f;--bd:#2a3542;--bad:#f97066;--ok:#47cd89;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:8px 0 2px}
.sub{color:var(--mu);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1}
button,input,select{font:inherit}
button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;cursor:pointer}
button.p,.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.d{color:var(--bad)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.msg{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.row span:first-child{color:var(--mu)}
.badge{padding:2px 10px;border-radius:99px;font-size:13px;background:var(--ac2);color:var(--ok)}
.badge.x{color:var(--bad)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.note{font-size:13px;color:var(--mu);background:var(--ac2);border-radius:10px;padding:10px 12px}
.hide{display:none}
.pw{position:relative}.pw input{padding-inline-end:44px}
.pw .eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;padding:6px 8px;line-height:0;color:var(--mu)}

:root{--bg:#eef5f7;--card:#fff;--tx:#0d2230;--mu:#587080;--ac:#0b6e8a;--ac2:#e0f0f5;--bd:#d3e3ea;--ok:#0a7a52}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08161f;--card:#0f2430;--tx:#e6f1f5;--mu:#8fa9b6;--ac:#3cc3e0;--ac2:#10323f;--bd:#1b3b4a;--ok:#4ade9a}
:root:not([data-theme="light"]) .brand img{filter:invert(1)}
:root:not([data-theme="light"]) button.p,:root:not([data-theme="light"]) .tabs button.on{color:#052431}}
:root[data-theme="dark"]{--bg:#08161f;--card:#0f2430;--tx:#e6f1f5;--mu:#8fa9b6;--ac:#3cc3e0;--ac2:#10323f;--bd:#1b3b4a;--ok:#4ade9a}
:root[data-theme="dark"] .brand img{filter:invert(1)}
:root[data-theme="dark"] button.p,:root[data-theme="dark"] .tabs button.on{color:#052431}
body{font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;background-color:var(--bg);background-image:linear-gradient(180deg,var(--card),var(--bg) 300px);background-repeat:no-repeat}
.brand{text-align:center;margin:6px 0 22px}
.brand img{display:block;width:min(250px,68%);height:auto;margin:0 auto 14px}
.brand h1{text-align:center;margin:0 0 2px}
.brand .sub{text-align:center;margin:0}
#login .card{border-top:3px solid var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

tr.sel td{background:var(--ac2)}
button:disabled{opacity:.6;cursor:wait}
.stamp{font-size:12px;color:var(--mu);text-align:center;margin-top:10px}
.toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px}
</style>
</head>

<script>
// الإعداد (رابط Supabase والمفتاح) موجود في ملف config.js
const CONFIG=window.CONFIG||{SUPABASE_URL:"",SUPABASE_KEY:""};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const EYE='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
function eye(id,b){const i=$(id),s=i.type==="password";i.type=s?"text":"password";b.innerHTML=s?EYEOFF:EYE}
function resetEyes(){document.querySelectorAll(".eye").forEach(b=>b.innerHTML=EYE);["mp","ap","f_pin","c_cur","c_new","c_new2"].forEach(i=>$(i).type="password")}
resetEyes();$("demoNote").classList.toggle("hide",!!CONFIG.SUPABASE_URL);

// ---- الاتصال: يعمل مع Apps Script، أو بيانات تجريبية إذا لم يُضبط الرابط ----
const demo=[
 {n:"0001",name:"أحمد العتيبي",pin:"1234",plan:"ذهبية",phone:"0501234567",joined:"2025-01-10",points:1200,active:true},
 {n:"0002",name:"سارة الدوسري",pin:"5678",plan:"فضية",phone:"0557654321",joined:"2025-09-03",points:700,active:true},
 {n:"0003",name:"خالد الشمري",pin:"4321",plan:"عادية",phone:"0539876543",joined:"2024-06-21",points:300,active:false}];
async function api(b){
  if(CONFIG.SUPABASE_URL){
    const map={login:["member_login",{p_n:b.n,p_pin:b.pin}],changepin:["member_change_pin",{p_n:b.n,p_pin:b.pin,p_new:b.newpin}],list:["admin_list",{p_pw:b.pw}],save:["admin_save",{p_pw:b.pw,p_member:b.member,p_orig:b.orig||null}],delete:["admin_delete",{p_pw:b.pw,p_n:b.n}]};
    const [fn,args]=map[b.action];
    const r=await fetch(CONFIG.SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"Content-Type":"application/json",apikey:CONFIG.SUPABASE_KEY,...(CONFIG.SUPABASE_KEY.startsWith("eyJ")?{Authorization:"Bearer "+CONFIG.SUPABASE_KEY}:{})},body:JSON.stringify(args)});
    return r.json();
  }
  const strip=({pin,...r})=>r;
  if(b.action==="login"){const m=demo.find(x=>x.n===b.n&&x.pin===b.pin);return m?{ok:true,member:strip(m)}:{ok:false,error:"رقم العضوية أو الرقم السري غير صحيح"}}
  if(b.action==="changepin"){const m=demo.find(x=>x.n===b.n&&x.pin===b.pin);if(!m)return{ok:false,error:"الرقم السري الحالي غير صحيح"};m.pin=b.newpin;return{ok:true}}
  if(b.pw!=="admin123")return{ok:false,error:"كلمة المرور غير صحيحة"};
  if(b.action==="list")return{ok:true,members:demo.map(strip)};
  if(b.action==="save"){const i=demo.findIndex(x=>x.n===(b.orig||b.member.n)),d=demo.findIndex(x=>x.n===b.member.n);
    if(d>=0&&d!==i)return{ok:false,error:"رقم العضوية مستخدم"};if(i<0)demo.push(b.member);else demo[i]={...b.member,pin:b.member.pin||demo[i].pin};return{ok:true}}
  if(b.action==="delete"){const i=demo.findIndex(x=>x.n===b.n);if(i>=0)demo.splice(i,1);return{ok:true}}
}

let mode="m",cred=null,adminPw=null,members=[],orig=null,timer=null;
const stampTxt=()=>"آخر تحديث: "+new Date().toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"});
function tab(m){mode=m;$("fm").classList.toggle("hide",m!=="m");$("fa").classList.toggle("hide",m!=="a");$("tm").classList.toggle("on",m==="m");$("ta").classList.toggle("on",m==="a");$("err").textContent=""}
function show(id){["login","member","admin"].forEach(s=>$(s).classList.toggle("hide",s!==id))}
function toast(t){const e=$("toast");e.textContent=t;e.classList.remove("hide");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add("hide"),2200)}
["mn","mp","ap"].forEach(i=>$(i).addEventListener("keydown",e=>{if(e.key==="Enter")go()}));

async function go(){
  const btn=$("gobtn");btn.disabled=true;$("err").textContent="";
  try{
    if(mode==="m"){
      const n=$("mn").value.trim().padStart(4,"0"),pin=$("mp").value.trim();
      const r=await api({action:"login",n,pin});if(!r.ok)throw r.error;
      cred={n,pin};showMember(r.member);
    }else{
      const pw=$("ap").value;const r=await api({action:"list",pw});if(!r.ok)throw r.error;
      adminPw=pw;members=r.members;renderTable();clearForm();show("admin");
    }
    startPoll();
  }catch(e){$("err").textContent=typeof e==="string"?e:"تعذر الاتصال، حاول مرة أخرى"}
  btn.disabled=false;
}
function out(){clearInterval(timer);cred=adminPw=null;orig=null;["mp","ap","mn","c_cur","c_new","c_new2"].forEach(i=>$(i).value="");$("pinform").classList.add("hide");$("perr").textContent="";resetEyes();$("err").textContent="";show("login")}
function startPoll(){clearInterval(timer);timer=setInterval(async()=>{
  if(document.hidden)return;
  try{if(adminPw)await refresh(true);else if(cred){const r=await api({action:"login",...cred});if(r.ok)showMember(r.member)}}catch(e){}
},30000)}

function togglePin(){$("pinform").classList.toggle("hide");$("perr").textContent=""}
async function changePin(){
  const cur=$("c_cur").value.trim(),n1=$("c_new").value.trim(),n2=$("c_new2").value.trim();
  const bad=!/^\d{4}$/.test(cur)?"أدخل الرقم السري الحالي (4 أرقام)":!/^\d{4}$/.test(n1)?"الرقم الجديد يجب أن يكون 4 أرقام":n1!==n2?"الرقمان غير متطابقين":n1===cur?"الرقم الجديد مطابق للحالي":"";
  if(bad){$("perr").textContent=bad;return}
  $("pbtn").disabled=true;$("perr").textContent="";
  try{
    const r=await api({action:"changepin",n:cred.n,pin:cur,newpin:n1});if(!r.ok)throw r.error;
    cred.pin=n1;["c_cur","c_new","c_new2"].forEach(i=>$(i).value="");resetEyes();$("pinform").classList.add("hide");toast("تم تغيير الرقم السري");
  }catch(e){$("perr").textContent=typeof e==="string"?e:"تعذر الاتصال، حاول مرة أخرى"}
  $("pbtn").disabled=false;
}
function showMember(m){
  $("mcard").innerHTML=`<div class="top"><h2 style="margin:0;font-size:18px">أهلاً ${esc(m.name)}</h2><button onclick="out()">خروج</button></div>
  <div class="card">
   <div class="row"><span>رقم العضوية</span><b>${esc(m.n)}</b></div>
   <div class="row"><span>نوع العضوية</span><b>${esc(m.plan)}</b></div>
   <div class="row"><span>رقم الجوال</span><b>${esc(m.phone)}</b></div>
   <div class="row"><span>تاريخ الانضمام</span><b>${esc(m.joined)}</b></div>
   <div class="row"><span>عدد النقاط</span><b>${esc(m.points)} نقطة</b></div>
   <div class="row"><span>الحالة</span><span class="badge ${m.active?"":"x"}">${m.active?"فعّالة":"منتهية"}</span></div>
   <div class="stamp">${stampTxt()}</div></div>`;
  show("member");
}

function renderTable(){
  $("cnt").textContent=members.length;
  $("tb").innerHTML=members.map(m=>`<tr class="${m.n===orig?"sel":""}"><td>${esc(m.n)}</td><td>${esc(m.name)}</td><td>${esc(m.plan)}</td><td>${esc(m.phone)}</td><td>${esc(m.points)}</td><td>${m.active?"فعّالة":"منتهية"}</td>
  <td><button onclick="edit('${esc(m.n)}')">تعديل</button> <button class="d" onclick="del('${esc(m.n)}')">حذف</button></td></tr>`).join("");
  $("stamp").textContent=stampTxt();
}
async function refresh(quiet){
  if(!adminPw)return;
  const r=await api({action:"list",pw:adminPw});
  if(r.ok){members=r.members;renderTable();if(!quiet)toast("تم التحديث")}else if(!quiet)toast(r.error);
}
function exportCsv(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"',t=v=>'="'+v+'"';
  const rows=[["رقم العضوية","الاسم","نوع العضوية","الجوال","تاريخ الانضمام","النقاط","الحالة"].map(q),...members.map(m=>[t(m.n),q(m.name),q(m.plan),t(m.phone),q(m.joined),m.points,q(m.active?"فعّالة":"منتهية")])];
  const csv="\ufeff"+rows.map(r=>r.join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download="members-"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove();toast("تم تنزيل النسخة");
}
function fill(m){["n","name","pin","plan","phone","joined","points"].forEach(k=>$("f_"+k).value=m[k]??"");$("f_active").value=m.active?"1":"0"}
function clearForm(){orig=null;fill({n:"",name:"",pin:"",plan:"عادية",phone:"",joined:new Date().toISOString().slice(0,10),points:0,active:true});
  $("ftitle").textContent="إضافة عضو";$("f_pin").placeholder="";$("sbtn").textContent="إضافة";$("cbtn").classList.add("hide");$("aerr").textContent="";renderTable()}
function edit(n){const m=members.find(x=>x.n===n);if(!m)return;orig=n;fill(m);
  $("ftitle").textContent="تعديل عضو";$("f_pin").placeholder="اتركه فارغاً للإبقاء على الحالي";$("sbtn").textContent="حفظ التعديل";$("cbtn").classList.remove("hide");$("aerr").textContent="";
  renderTable();$("formcard").scrollIntoView({behavior:"smooth",block:"start"})}
async function save(){
  const g=k=>$("f_"+k).value.trim();
  const m={n:g("n").padStart(4,"0"),name:g("name"),pin:g("pin"),plan:g("plan"),phone:g("phone"),joined:g("joined"),points:parseInt(g("points"),10),active:g("active")==="1"};
  const bad=!/^\d{1,6}$/.test(g("n"))?"رقم العضوية أرقام فقط":!m.name?"الاسم مطلوب":(m.pin||!orig)&&!/^\d{4}$/.test(m.pin)?"الرقم السري 4 أرقام":!/^\d{10}$/.test(m.phone)?"رقم الجوال 10 أرقام":!(m.points>=0)?"النقاط لا تقل عن صفر":"";
  if(bad){$("aerr").textContent=bad;return}
  $("sbtn").disabled=true;
  try{const r=await api({action:"save",pw:adminPw,member:m,orig});
    if(!r.ok){$("aerr").textContent=r.error;}else{toast("تم الحفظ");orig=null;await refresh(true);clearForm()}
  }catch(e){$("aerr").textContent="تعذر الاتصال، حاول مرة أخرى"}
  $("sbtn").disabled=false;
}
async function del(n){if(!confirm("حذف هذا العضو؟"))return;
  try{const r=await api({action:"delete",pw:adminPw,n});if(r.ok){toast("تم الحذف");if(orig===n)orig=null;await refresh(true)}else toast(r.error)}catch(e){toast("تعذر الاتصال")}}
</script>
</body>
</html>
